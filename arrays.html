<html>
  <head></head>
  <body>
    <p>To Do List</p>
    <input class="js-input" placeholder = "Add a task">
    <input type="date" class="js-dueDate">
    <button onclick="
    addToDO();
    ">Add</button>
    <div class="js-tolist"></div>
    <script>
      const todoList=[{
        name:'Make dinner',
        dueDate: '03-08-2026'},
      { 
        name:'Wash dishes',
        dueDate: '03-08-2026'
    }];
      renderHtml();
      function renderHtml(){
      let todoListHtml = '';
      todoList.forEach((todoObject, index) => {
        // const name = todoObject.name;
        // const dueDate= todoObject.dueDate;
        const {name, dueDate} =  todoObject;
        const html = `
        <div>${name}</div>
        <div>${dueDate}</div>
        <button onclick="deleteTask(${index})">Delete</button>
        `;
        todoListHtml += html;
      });
    
      document.querySelector('.js-tolist').innerHTML = todoListHtml;
  }
      function deleteTask(index){
        todoList.splice(index, 1);
        renderHtml();
      }
      function addToDO(){
        const inputElement = document.querySelector('.js-input');
        const name = inputElement.value;
        const dateinputElement = document.querySelector('.js-dueDate');
        const dueDate = dateinputElement.value;
        todoList.push({
          name, 
          dueDate
        });
        dateinputElement.value = '';
        inputElement.value = '';
        renderHtml();
      }
    </script>
  </body>
</html>
