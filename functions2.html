    <script>
      let employeeName = "Hari";
      let age = 23;
      let isEmployee = true;
      let hasAccessCard = true;

      function checkAccess(age, isEmployee, hasAccessCard) {

          if (age >= 18 && isEmployee && hasAccessCard) {
              return "Access granted";
          } else {
              return "Access denied";
          }
      }

      let result = checkAccess(age, isEmployee, hasAccessCard);

      console.log(employeeName);
      console.log(result);
      let roles = ["Admin", "Manager", "Employee"];
      let access = roles.map(role => {
          if (role === "Admin") {
              return "Full access";
          } else if (role === "Manager") {
              return "Limited access";
          } else {
              return "No access";
          }
      });
      console.log(access);
