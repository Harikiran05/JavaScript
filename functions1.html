<html>
  <head>
    <title>Prime Numbers</title>
  </head>
  <body>
    <script>
      function debounce(fn, delay) {
    let timeoutId;                     // closure variable — persists between calls

    return function(...args) {
        clearTimeout(timeoutId);       // cancel the previous pending call
        timeoutId = setTimeout(() => {
            fn(...args);
        }, delay);
    };
}

function search(query) {
    console.log("Searching for:", query);
}
const debouncedSearch = debounce(search, 300);

debouncedSearch("h");
debouncedSearch("ha");
debouncedSearch("har");
debouncedSearch("hari");
// Only ONE search actually fires — "Searching for: hari" — 300ms after the last call
function sortArray(arr) {
    return arr.sort((a, b) => a - b);
}
const numbers = [5, 2, 9, 1, 5, 6];
const sortedNumbers = sortArray(numbers);
console.log(sortedNumbers);  // [1, 2, 5, 5, 6, 9]
function advancedFunction(a, b, c) {
    return a + b * c;
}
const result = advancedFunction(2, 3, 4);
console.log(result);  
function arrowFunction(x) {
    return x * x; 
}
const square = arrowFunction(5);
console.log(square);  // 25
function createBankAccount(initialBalance) {
    let balance = initialBalance;   // private variable, only accessible via returned methods

    return {
        deposit: function(amount) {
            balance = balance + amount;
            return balance;
        },
        withdraw: function(amount) {
            if (amount > balance) {
                return "Insufficient funds";
            }
            balance = balance - amount;
            return balance;
        },
        getBalance: function() {
            return balance;
        }
    };
}

const myAccount = createBankAccount(100);
console.log(myAccount.deposit(50));    // 150
console.log(myAccount.withdraw(30));   // 120
console.log(myAccount.getBalance());   // 120
console.log(myAccount.balance);        // undefined — can't access directly!
    </script>
  </body>
</html>
