<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
    >

    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="container">
      
      <h1>Todo App</h1>

      <input 
      type="text"
      id="search-input"
      placeholder="Search todos..."
      >

      <form id="todo-form">
      
      <input
      type="text"
      id="todo-input"
      placeholder="Enter a Todo"
      required
      >

      <button type="submit">
        Add Todo
      </button>

      </form>

      <p id="loading">Loading...</p>

      <ul id="todo-list"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
