<html>
  <head>
    <title>Prime Numbers</title>
  </head>
  <body>
    <h1>Prime Numbers</h1>
    <p>This is a simple page to display prime numbers.</p>
    <script>
      function isPrime(num) {
        if (num <= 1) return false;
        for (let i = 2; i <= Math.sqrt(num); i++) {
          if (num % i === 0) return false;
        }
        return true;
      }

      function getPrimesUpTo(max) {
        const primes = [];
        for (let i = 2; i <= max; i++) {
          if (isPrime(i)) {
            primes.push(i);
          }
        }
        return primes;
      }

      const primeNumbers = getPrimesUpTo(100);
      console.log(primeNumbers);
      function arrayMethodsDemo() {
        const numbers = [1, 2, 3, 4, 5];
        console.log("Original array:", numbers);

        // forEach
        numbers.forEach(num => console.log("forEach:", num));

        // map
        const squared = numbers.map(num => num * num);
        console.log("Squared array:", squared);

        // filter
        const evenNumbers = numbers.filter(num => num % 2 === 0);
        console.log("Even numbers:", evenNumbers);

        // reduce
        const sum = numbers.reduce((acc, num) => acc + num, 0);
        console.log("Sum of numbers:", sum);
      }
      arrayMethodsDemo();
      [1, 2, 3].forEach((item, index, array) => {
        console.log(item, index, array);
      });
      </script>
  </body>
</html>
