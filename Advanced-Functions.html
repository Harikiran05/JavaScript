      function countPositiveNumbers(array){
        let count = 0;
        array.forEach((value) => {
          if(value > 0){
            count++;
          }
        });
        return count;
      }
      console.log(countPositiveNumbers([1, -2, 3, -4, 5]));
      function removeEggs(array){
        const result = [];
        array.filter((value) => {
          if(value !== 'egg'){
            result.push(value);
          }
        });
        return result;
      }console.log([1,1,3].map((value, index) =>{
        return value * 2;
      }));
      console.log(removeEggs(['egg', 'bacon', 'egg', 'sausage']));
      function removefirsttwoEggs(array){
        let count = 0;
        return array.filter((value)=>{
          if(value === 'egg' && count < 2){
            count++;
            return false;
          }
          return true;
        });
      }
      console.log(removefirsttwoEggs(['egg','egg', 'bacon', 'egg', 'egg', 'sausage', 'egg']));
