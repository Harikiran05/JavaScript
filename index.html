<html>
  <head>
  </head>
  <body>
    <p>Heads or Tails</p>
    <button onclick="playGame('heads')">Heads</button> 
    <button onclick="playGame('tails')">Tails</button>
    <button onclick="
    score.wins = 0;
    score.losses = 0;
    localStorage.removeItem('score')">Reset Score</button>
    <p class="js-score"></p>
    <script>
      let score = JSON.parse(localStorage.getItem('score')) || { wins: 0, losses: 0 };
      function playGame(guess){
        const randomNumber = Math.random();
        const result = randomNumber < 0.5 ? 'heads' : 'tails';
        if(guess === result){
          score.wins++;
          console.log('you win');
        } else {
          score.losses++;
          console.log('you lose');
        }
        localStorage.setItem('score', JSON.stringify(score));
        document.querySelector('.js-score').innerHTML = `wins: ${score.wins}, losses: ${score.losses}`;
      }
   </script>
  </body>
</html>
