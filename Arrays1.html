    <script>
      const myArray = [10, 20 ,30];
      myArray[2] = 99;
      console.log(myArray)
      function getLastValue(array){
        const lastIndex= array.length-1;
        return array[lastIndex];
      }
      console.log(getLastValue(myArray));
      function swapArray(array){
        const lastElement= array.length-1;
        const lastValue= array[lastElement];
        
        const firstValue= array[0];
        array[0] = lastValue;
        array[lastElement] = firstValue;
        return array;
      }
      console.log(swapArray(myArray));
      for(let i=0; i<=10; i+=2){
        console.log(i);
      }
      for(let i=5; i>=0; i--){
        console.log(i);
      }
      let i=0;
      while(i<10){
        i= i+2;
        console.log(i);
      }
      let a=5;
      while(a>=0){
        console.log(a);
        a--;
      }
      const Array = [1, 2, 3];
      const result=[];
      for(let i=0; i<Array.length; i++);{
        result.push(Array[i]+1);
      }
      function addNum(array, num){
        const result=[];
        for(let i=0; i<array.length; i++){
          result.push(array[i] + num);
        }
        return result;
        
      }
      console.log(addNum([1, 2, 3], 5));
      function addArrays(arr1, arr2){
        const result=[];
        for(let i=0; i<arr1.length; i++){
          result.push(arr1[i]+arr2[i])
        }
        return result;
      }
      console.log(addArrays([1, 2, 3],[1, 2, 3]));
      function countPositive(nums){
        const result=[];
        for(let i=0; i<nums.length; i++){
          if(nums[i]>0){
            result.push(nums[i]);
          }
        }
        return result;
      }
      console.log(countPositive([1, -4, -5, 6]))
    </script>
